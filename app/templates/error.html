{% extends "base.html" %}
{% block title %}Error {{ status }} · Smart Resume Analyzer{% endblock %}
{% block content %}
<div class="container py-5 text-center" style="max-width: 640px;">
  <div class="display-4 fw-bold" style="color:var(--navy)">{{ status }}</div>
  <p class="lead text-secondary-ink">{{ message }}</p>
  <a href="{{ url_for('main.upload_page') }}" class="btn btn-brand"><i class="bi bi-upload me-1"></i>Analyze a resume</a>
</div>
{% endblock %}
